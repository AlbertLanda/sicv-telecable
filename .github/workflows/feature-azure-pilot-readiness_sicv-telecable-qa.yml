# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - sicv-telecable-qa

on:
  push:
    branches:
      - feature/azure-pilot-readiness
  workflow_dispatch:

concurrency:
  group: sicv-telecable-qa-deployment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Validate before deploying QA
        env:
          DJANGO_SECRET_KEY: qa-build-only-key-not-used-by-the-cloud
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          source antenv/bin/activate
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --verbosity 1

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.
      - name: Record deployed QA revision
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path("apps/fiscal/static/fiscal/qa-release.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({"commit": os.environ["GITHUB_SHA"], "environment": "qa"}))
          PYCODE

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/
            !.env
            !.env.*
            !db.sqlite3*
            !media/
            !staticfiles/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_314F1F461E5C4F7B8893F341BB608B0D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7C571DEA87F74FCC80BAD9B340012275 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4B466E215E0B47FF9658BF99FFF88EEB }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'sicv-telecable-qa'
          slot-name: 'Production'

      - name: Verify running QA revision and login
        env:
          QA_URL: https://sicv-telecable-qa-f8fnfrhug3cwajc6.centralus-01.azurewebsites.net
        run: |
          python - <<'PYCODE'
          import json, os, time
          from urllib.request import urlopen
          from urllib.error import URLError
          base = os.environ["QA_URL"]
          expected = os.environ["GITHUB_SHA"]
          for attempt in range(36):
              try:
                  with urlopen(base + "/static/fiscal/qa-release.json?revision=" + expected, timeout=15) as response:
                      version = json.load(response)
                  if version.get("commit") != expected:
                      raise ValueError("QA is still serving the previous revision")
                  with urlopen(base + "/accounts/login/", timeout=15) as response:
                      assert response.status == 200
                  print("QA ready with commit", expected)
                  break
              except (URLError, ValueError, AssertionError) as error:
                  print("Waiting for QA startup:", str(error))
                  if attempt == 35:
                      raise
                  time.sleep(10)
          PYCODE
