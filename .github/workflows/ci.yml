name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  validaciones:
    name: Validaciones Django (check, migraciones, tests)
    runs-on: ubuntu-latest
    # La suite completa ya supera los 15 minutos con la cobertura del canal
    # técnico. El límite anterior cancelaba el job después de que los tests
    # terminaban correctamente, por lo que se amplía el margen sin cambiar
    # ninguna validación.
    timeout-minutes: 30

    env:
      # Clave exclusiva de CI. No es un secreto real y no se usa en ningun entorno.
      DJANGO_SECRET_KEY: ci-only-insecure-key-for-automated-tests
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar configuracion del proyecto
        run: python manage.py check

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar la suite de pruebas
        run: python manage.py test --verbosity 2

      - name: Reporte de hardening (informativo)
        continue-on-error: true
        run: python manage.py check --deploy
