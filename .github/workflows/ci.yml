name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: [develop]

jobs:
  validaciones:
    name: Validaciones Django (check, migraciones, tests)
    runs-on: ubuntu-latest
    # La suite completa ya supera los 15 minutos con la cobertura del canal
    # técnico. El límite anterior cancelaba el job después de que los tests
    # terminaban correctamente, por lo que se amplía el margen sin cambiar
    # ninguna validación.
    timeout-minutes: 30

    env:
      # Clave exclusiva de CI. No es un secreto real y no se usa en ningun entorno.
      DJANGO_SECRET_KEY: ci-only-insecure-key-for-automated-tests
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar configuracion del proyecto
        run: python manage.py check

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Validar perfil de configuracion Azure
        env:
          DJANGO_SECRET_KEY: azure-ci-only-long-secret-key-not-for-production-123456789
          DJANGO_DEBUG: "False"
          DJANGO_PRODUCTION: "True"
          DJANGO_ALLOWED_HOSTS: sicv-pilot.azurewebsites.net
          DJANGO_CSRF_TRUSTED_ORIGINS: https://sicv-pilot.azurewebsites.net
          DJANGO_DB_ENGINE: postgresql
          DJANGO_DB_NAME: sicv_ci
          DJANGO_DB_USER: sicv_ci_user
          DJANGO_DB_PASSWORD: ci-only-password
          DJANGO_DB_HOST: sicv-ci.postgres.database.azure.com
          DJANGO_DB_PORT: "5432"
          DJANGO_DB_SSLMODE: require
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")

          import django
          django.setup()

          from django.conf import settings

          assert settings.PRODUCTION is True
          assert settings.DEBUG is False
          assert settings.SECURE_SSL_REDIRECT is True
          assert settings.SESSION_COOKIE_SECURE is True
          assert settings.CSRF_COOKIE_SECURE is True
          assert settings.DATABASES["default"]["ENGINE"] == "django.db.backends.postgresql"
          assert settings.DATABASES["default"]["OPTIONS"]["sslmode"] == "require"
          assert (
              settings.STORAGES["staticfiles"]["BACKEND"]
              == "whitenoise.storage.CompressedManifestStaticFilesStorage"
          )
          print("Perfil Azure cargado correctamente")
          PY

      - name: Ejecutar la suite de pruebas
        run: python manage.py test --verbosity 2

      - name: Reporte de hardening (informativo)
        continue-on-error: true
        run: python manage.py check --deploy

  concurrencia-cobranza:
    name: Instalaciones, cobranza y pruebas OSE (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sicv_collection_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key-for-automated-tests
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: sicv_collection_ci
      DJANGO_DB_USER: postgres
      DJANGO_DB_PASSWORD: ci-only-password
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verificar instalaciones, saldo, reintentos y transiciones concurrentes
        run: >-
          python manage.py test
          apps.contracts.tests.InstallationWorkOrderCreateTests
          apps.work_orders.tests.test_ftth_installation_publication
          apps.customers.test_qa_samples
          apps.customers.test_qa_billing_examples
          apps.payments.tests.test_confirmed_billing_rules
          apps.reports.tests.test_dashboard
          apps.reports.tests.test_customer_quality
          apps.equipment
          apps.work_orders.tests.test_api_field_workflow.TechnicianFieldWorkflowAPITests.test_four_digit_equipment_reference_flows_to_liquidation_without_registry
          apps.work_orders.tests.test_results
          apps.payments.tests.test_collection apps.fiscal --verbosity 2
